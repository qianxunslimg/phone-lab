name: Build Companion APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app-android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug & Release APK
        working-directory: app-android
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-mini-server-apk
          path: app-android/app/build/outputs/apk/release/app-release.apk

      - name: Publish latest APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: "Phone Mini-Server Companion App (Latest)"
          body: |
            原生安卓配套伴侣 App（纯 Android SDK、零第三方依赖）：
            - 一键开启 / 关闭 / 重启 Ubuntu 小主机（Root 调用 `/data/local/linux/linux.sh`）
            - 一键开关开机自启、查看当前局域网 IP 与电池状态
            - 内置 WebView 直达 `:8888` 控制台、`:8080` 轻网盘、`:7681` 网页终端
          files: |
            app-android/app/build/outputs/apk/release/app-release.apk
          make_latest: true
